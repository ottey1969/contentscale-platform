          <strong style="color:#a78bfa;">💡 Warmup tip:</strong> Start warmup mode first, then run your scans. The cap resets each day and picks up exactly where you left off — even if you close the browser.
        </div>

        <!-- SPF / DKIM / DMARC section -->
        <div style="border-top:1px solid #1f2937;padding-top:20px;margin-top:4px;">
          <div style="color:#9ca3af;font-size:0.78rem;font-weight:700;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.06em;">🔐 DNS Authentication (Required Before Sending)</div>
          <p style="color:#6b7280;font-size:0.78rem;margin-bottom:14px;">Without these 3 DNS records, your emails will land in spam regardless of warmup. Set these in your domain registrar (Cloudflare / GoDaddy / Namecheap).</p>

          <div style="display:grid;gap:10px;">

            <div style="background:#0f2d1a;border:1px solid #166534;border-radius:10px;padding:14px 16px;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                <span style="color:#4ade80;font-weight:700;font-size:0.85rem;">✅ SPF Record</span>
                <span style="background:#14532d;color:#86efac;padding:2px 8px;border-radius:99px;font-size:0.7rem;">TXT Record</span>
              </div>
              <p style="color:#86efac;font-size:0.78rem;margin-bottom:8px;">Tells mail servers that SendGrid is authorised to send email on behalf of your domain.</p>
              <div style="background:#052e16;border-radius:6px;padding:8px 12px;font-family:monospace;font-size:0.75rem;color:#4ade80;">
                <div style="color:#6b7280;margin-bottom:2px;">Name: @ (or your domain)</div>
                v=spf1 include:sendgrid.net ~all
              </div>
            </div>

            <div style="background:#1e1b4b;border:1px solid #4c1d95;border-radius:10px;padding:14px 16px;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                <span style="color:#a78bfa;font-weight:700;font-size:0.85rem;">🔑 DKIM Record</span>
                <span style="background:#2e1065;color:#c4b5fd;padding:2px 8px;border-radius:99px;font-size:0.7rem;">CNAME Record</span>
              </div>
              <p style="color:#c4b5fd;font-size:0.78rem;margin-bottom:8px;">Cryptographic signature proving emails actually came from you. Generated automatically in SendGrid — go to <strong>Settings → Sender Authentication → Authenticate Your Domain</strong>.</p>
              <div style="background:#1a0533;border-radius:6px;padding:8px 12px;font-size:0.75rem;color:#a78bfa;">
                SendGrid generates 2 CNAME records for your domain. Copy them exactly into your DNS. Takes 24–48 hrs to propagate.
              </div>
            </div>

            <div style="background:#1c0a00;border:1px solid #92400e;border-radius:10px;padding:14px 16px;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                <span style="color:#fbbf24;font-weight:700;font-size:0.85rem;">🛡️ DMARC Record</span>
                <span style="background:#431407;color:#fed7aa;padding:2px 8px;border-radius:99px;font-size:0.7rem;">TXT Record</span>
              </div>
              <p style="color:#fde68a;font-size:0.78rem;margin-bottom:8px;">Protects your domain from being spoofed. Tells receiving servers what to do if SPF/DKIM fail.</p>
              <div style="background:#0c0500;border-radius:6px;padding:8px 12px;font-family:monospace;font-size:0.75rem;color:#fbbf24;">
                <div style="color:#6b7280;margin-bottom:2px;">Name: _dmarc (or _dmarc.yourdomain.com)</div>
                v=DMARC1; p=none; rua=mailto:<a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="e2868f839081a29b8d9790868d8f838b8ccc818d8f">[email&#160;protected]</a>
              </div>
              <p style="color:#92400e;font-size:0.72rem;margin-top:6px;">Start with p=none (monitor only). Move to p=quarantine after 2 weeks of clean reports.</p>
            </div>

          </div>

          <div style="margin-top:14px;background:#111827;border-radius:8px;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <span style="font-size:1.2rem;">🧪</span>
