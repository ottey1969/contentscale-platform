<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boost Admin — ContentScale</title>
<style>
:root{--blue:#0a66c2;--purple:#6b21a8;--green:#15803d;--red:#dc2626;--border:#e5e7eb;--muted:#6b7280;--bg:#f3f4f6;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:#111;min-height:100vh}
.header{background:linear-gradient(135deg,#0a66c2,#6b21a8);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:1.05rem;font-weight:700}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:14px}
.card h2{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
label:first-of-type{margin-top:0}
input,textarea,select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;outline:none;background:#fff}
input:focus,textarea:focus{border-color:var(--blue)}
textarea{height:90px;resize:vertical}
.btn{padding:9px 18px;border:none;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--purple);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-sm{padding:5px 12px;font-size:11px}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
.stat-num{font-size:26px;font-weight:700}
.stat-lbl{font-size:11px;color:var(--muted)}
.user-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;flex-wrap:wrap}
.user-row:last-child{border-bottom:none}
.badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700}
.tier-free{background:#f3f4f6;color:#374151}
.tier-pro{background:#ede9fe;color:#6b21a8}
.tier-admin{background:#fef9c3;color:#854d0e}
.session-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.session-row:last-child{border-bottom:none}
.token-box{background:#f9fafb;border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-family:monospace;font-size:13px;word-break:break-all;margin-top:8px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;display:none;z-index:9999}
#overlay{position:fixed;inset:0;background:rgba(255,255,255,.8);display:none;align-items:center;justify-content:center;font-size:14px;color:var(--purple);font-weight:700;z-index:999}
</style>
</head>
<body>
<div id="toast"></div>
<div id="overlay" style="display:none;"><div>Generating... please wait</div></div>

<div class="header">
  <h1>🚀 Boost Admin — Ottmar</h1>
  <small style="opacity:.8;font-size:12px;">contentscale.site</small>
</div>

<div class="wrap">

  <!-- Settings -->
  <div class="card">
    <h2>Settings</h2>
    <label>Claude API Key</label>
    <input type="password" id="apiKey" placeholder="sk-ant-api03-...">
    <label>Server URL</label>
    <input type="text" id="serverUrl" value="https://app.contentscale.site">
    <div style="margin-top:10px;display:flex;gap:8px;">
      <button class="btn btn-blue" onclick="saveSettings()">Save</button>
      <button class="btn btn-ghost" onclick="loadAll()">↻ Refresh all</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="grid2" style="margin-bottom:14px;">
    <div class="stat-card"><div class="stat-num" id="st-users">—</div><div class="stat-lbl">Users</div></div>
    <div class="stat-card"><div class="stat-num" id="st-sessions">—</div><div class="stat-lbl">Active sessions</div></div>
  </div>

  <!-- Invite User -->
  <div class="card">
    <h2>Invite / Create User</h2>
    <div class="grid2">
      <div>
        <label>Name</label>
        <input type="text" id="invName" placeholder="e.g. Sarah">
      </div>
      <div>
        <label>Token (unique)</label>
        <input type="text" id="invToken" placeholder="e.g. sarah-boost-2026">
      </div>
    </div>
    <label>Email (optional)</label>
    <input type="text" id="invEmail" placeholder="sarah@example.com">
    <label>Tier</label>
    <select id="invTier">
      <option value="free">Free — 1 session/week, 10 credits</option>
      <option value="pro">Pro — unlimited sessions</option>
    </select>
    <label>Notes</label>
    <input type="text" id="invNotes" placeholder="Client name, company, notes...">
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="createUser()">Create User</button>
      <button class="btn btn-ghost btn-sm" onclick="genToken()">Auto-generate token</button>
    </div>
    <div id="newUserResult" style="display:none;margin-top:12px;">
      <div style="font-size:12px;font-weight:600;color:var(--green);margin-bottom:4px;">✅ User created! Share this link:</div>
      <div class="token-box" id="newUserLink">—</div>
      <div style="margin-top:8px;display:flex;gap:6px;">
        <button class="btn btn-ghost btn-sm" onclick="copyResult()">Copy link</button>
        <a id="waLink" href="#" target="_blank" class="btn btn-green btn-sm" style="text-decoration:none;">WhatsApp</a>
      </div>
    </div>
  </div>

  <!-- Users -->
  <div class="card">
    <h2>All Users <span id="userCount" style="font-weight:400;text-transform:none;color:var(--muted);"></span></h2>
    <div id="usersList"><div style="color:var(--muted);font-size:13px;">Loading...</div></div>
  </div>

  <!-- Create Boost Session (for Ottmar's posts) -->
  <div class="card">
    <h2>Create Boost Session (Your Post)</h2>
    <label>LinkedIn Post URL</label>
    <input type="url" id="postUrl" placeholder="https://www.linkedin.com/posts/...">
    <label>Post Text</label>
    <textarea id="postText" placeholder="Paste your LinkedIn post..."></textarea>
    <label>Client name shown to participants</label>
    <input type="text" id="clientName" value="Ottmar Francisca — ContentScale">
    <button class="btn btn-primary" style="margin-top:12px;width:100%;" onclick="createBoost()">⚡ Generate 6 Comments</button>
    <div id="boostResult" style="display:none;margin-top:12px;">
      <div style="font-size:12px;font-weight:600;color:var(--green);margin-bottom:4px;">✅ Boost session live! Share:</div>
      <div class="token-box" id="boostLink">—</div>
      <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" onclick="copyBoostLink()">Copy link</button>
        <a id="boostWa" href="#" target="_blank" class="btn btn-green btn-sm" style="text-decoration:none;">WhatsApp</a>
      </div>
      <div id="previewComments" style="margin-top:12px;"></div>
    </div>
  </div>

  <!-- Active Sessions -->
  <div class="card">
    <h2>All Sessions</h2>
    <div id="sessionsList"><div style="color:var(--muted);font-size:13px;">Loading...</div></div>
  </div>

</div>

<script>
const ADMIN_TOKEN = 'ottmar-admin-2026';
let srv = '';
let apiKey = '';

function saveSettings() {
  apiKey = document.getElementById('apiKey').value.trim();
  srv    = document.getElementById('serverUrl').value.trim();
  localStorage.setItem('boostAdminKey', apiKey);
  localStorage.setItem('boostSrv', srv);
  toast('Saved ✅');
  loadAll();
}

function genToken() {
  const name = document.getElementById('invName').value.trim().toLowerCase().replace(/\s+/g,'-') || 'user';
  document.getElementById('invToken').value = name + '-boost-' + Date.now().toString().slice(-4);
}

async function createUser() {
  const name  = document.getElementById('invName').value.trim();
  const token = document.getElementById('invToken').value.trim();
  const email = document.getElementById('invEmail').value.trim();
  const tier  = document.getElementById('invTier').value;
  const notes = document.getElementById('invNotes').value.trim();
  if (!name || !token) { toast('Name and token required', true); return; }

  const r = await fetch(`${srv}/boost/admin/create-user`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ adminToken: ADMIN_TOKEN, name, token, email, tier, notes })
  });
  const data = await r.json();
  if (data.error) { toast(data.error, true); return; }

  const link = `${srv}/boost-platform?token=${token}`;
  document.getElementById('newUserLink').textContent = link;
  document.getElementById('waLink').href = `https://wa.me/?text=${encodeURIComponent(`Hi ${name}! Your ContentScale Boost access:\n${link}\n\nUse this to boost your LinkedIn posts and help others. Enjoy! 🚀`)}`;
  document.getElementById('newUserResult').style.display = 'block';
  toast(`User "${name}" created!`);
  loadUsers();
}

function copyResult() {
  const txt = document.getElementById('newUserLink').textContent;
  navigator.clipboard?.writeText(txt);
  toast('Copied!');
}

async function createBoost() {
  const postText  = document.getElementById('postText').value.trim();
  const postUrl   = document.getElementById('postUrl').value.trim();
  const clientName = document.getElementById('clientName').value.trim();
  if (!postText) { toast('Paste post text first', true); return; }
  if (!apiKey)   { toast('Enter Claude API key first', true); return; }

  document.getElementById('overlay').style.display = 'flex';

  const r = await fetch(`${srv}/boost/create`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ postText, postUrl, clientName, apiKey })
  });
  const data = await r.json();
  document.getElementById('overlay').style.display = 'none';
  if (data.error) { toast(data.error, true); return; }

  const link = `${srv}/boost-platform`;
  document.getElementById('boostLink').textContent = link;
  document.getElementById('boostWa').href = `https://wa.me/?text=${encodeURIComponent(`🚀 Help boost my post!\n${link}\n\n2 min, pick a comment, paste on LinkedIn. +2 credits for you! 🙏`)}`;
  document.getElementById('previewComments').innerHTML = (data.comments||[]).map((c,i) =>
    `<div style="background:#f9fafb;border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:12px;margin-bottom:6px;color:#374151;"><strong style="font-size:10px;color:var(--muted);">OPTION ${i+1}</strong><br>${c}</div>`
  ).join('');
  document.getElementById('boostResult').style.display = 'block';
  toast('Boost session live! 🚀');
  loadSessions();
}

function copyBoostLink() {
  navigator.clipboard?.writeText(document.getElementById('boostLink').textContent);
  toast('Copied!');
}

async function loadUsers() {
  const r = await fetch(`${srv}/boost/admin/users?adminToken=${ADMIN_TOKEN}`);
  const data = await r.json();
  const users = data.users || [];
  document.getElementById('st-users').textContent = users.length;
  document.getElementById('userCount').textContent = `(${users.length})`;
  document.getElementById('usersList').innerHTML = users.map(u => `
    <div class="user-row">
      <div style="flex:1">
        <strong>${u.name}</strong>
        <span class="badge tier-${u.tier}" style="margin-left:6px;">${u.tier}</span>
        ${u.email ? `<span style="color:var(--muted);font-size:11px;margin-left:6px;">${u.email}</span>` : ''}
        <div style="font-size:11px;color:var(--muted);margin-top:2px;">
          Credits: ${u.tier==='admin'?'∞':u.credits} · Token: <code style="font-size:11px;">${u.token}</code>
          ${u.notes ? ` · ${u.notes}` : ''}
        </div>
      </div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;">
        ${u.tier==='free'  ? `<button class="btn btn-sm" style="background:#ede9fe;color:#6b21a8;" onclick="upgradeTier('${u.token}','pro')">→ Pro</button>` : ''}
        ${u.tier==='pro'   ? `<button class="btn btn-sm btn-ghost" onclick="upgradeTier('${u.token}','free')">→ Free</button>` : ''}
        <button class="btn btn-sm btn-ghost" onclick="addCredits('${u.token}')">+Credits</button>
        <button class="btn btn-sm" style="background:#fee2e2;color:#991b1b;" onclick="toggleUser('${u.token}',${u.active})">
          ${u.active ? 'Disable' : 'Enable'}
        </button>
      </div>
    </div>
  `).join('') || '<div style="color:var(--muted);font-size:13px;">No users yet.</div>';
}

async function upgradeTier(token, tier) {
  await fetch(`${srv}/boost/admin/update-user`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ adminToken: ADMIN_TOKEN, token, tier })
  });
  toast(`Upgraded to ${tier}`);
  loadUsers();
}

async function addCredits(token) {
  const amount = prompt('Credits to add:', '10');
  if (!amount) return;
  await fetch(`${srv}/boost/admin/add-credits`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ adminToken: ADMIN_TOKEN, token, amount: parseInt(amount) })
  });
  toast(`+${amount} credits added`);
  loadUsers();
}

async function toggleUser(token, active) {
  await fetch(`${srv}/boost/admin/update-user`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ adminToken: ADMIN_TOKEN, token, active: !active })
  });
  toast(active ? 'User disabled' : 'User enabled');
  loadUsers();
}

async function loadSessions() {
  const r = await fetch(`${srv}/boost/api/sessions?adminToken=${ADMIN_TOKEN}`);
  const sessions = await r.json();
  document.getElementById('st-sessions').textContent = (sessions||[]).filter(s=>s.active).length;
  document.getElementById('sessionsList').innerHTML = (sessions||[]).map(s => `
    <div class="session-row">
      <div style="flex:1">
        <div style="font-size:11px;font-weight:700;color:var(--purple);">${s.client_name}</div>
        <div style="font-size:12px;color:#374151;margin:2px 0;">${(s.preview||'').substring(0,120)}…</div>
        <div style="font-size:11px;color:var(--muted);">${s.engagement_count} engaged · ${new Date(s.created_at).toLocaleDateString()}</div>
      </div>
      ${s.active ? `<button class="btn btn-sm btn-ghost" style="color:var(--red);" onclick="closeSession('${s.id}')">Close</button>` : '<span style="font-size:11px;color:var(--muted);">Closed</span>'}
    </div>
  `).join('') || '<div style="color:var(--muted);font-size:13px;">No sessions yet.</div>';
}

async function closeSession(id) {
  if (!confirm('Close this session?')) return;
  await fetch(`${srv}/boost/${id}/close`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ adminToken: ADMIN_TOKEN })
  });
  toast('Closed');
  loadSessions();
}

function loadAll() { loadUsers(); loadSessions(); }

function toast(msg, err=false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = err ? '#dc2626' : '#111';
  el.style.display = 'block';
  setTimeout(() => el.style.display='none', 3000);
}

// Init
const savedKey = localStorage.getItem('boostAdminKey');
const savedSrv = localStorage.getItem('boostSrv');
if (savedKey) { document.getElementById('apiKey').value = savedKey; apiKey = savedKey; }
if (savedSrv) { document.getElementById('serverUrl').value = savedSrv; srv = savedSrv; }
else { srv = 'https://app.contentscale.site'; }
loadAll();
</script>
</body>
</html>
