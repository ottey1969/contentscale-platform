name: Integrate canonical Tracker page journey (branch only)
on:
  push:
    branches:
      - feature/tracker-canonical-page-journey-20261017
    paths:
      - scripts/integrate-canonical-page-journey.cjs
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tracker-canonical-page-journey-20261017
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply one canonical Tracker lifecycle
        run: node scripts/integrate-canonical-page-journey.cjs --write
      - name: Verify real next-action state and server syntax
        run: |
          node scripts/canonical-page-journey.test.cjs
          node --check src/index.js
          node --check src/tracker-page-journey.cjs
          node scripts/tracker-optional-gsc-advice.test.cjs
          node scripts/tracker-growth-navigation.test.cjs
      - name: Save exact tested source on feature branch only
        run: |
          git config user.name "contentscale-tracker-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          if ! git diff --cached --quiet; then
            git commit -m "Use single page lifecycle for historical Brief and monitoring"
            git push origin HEAD:feature/tracker-canonical-page-journey-20261017
          fi
