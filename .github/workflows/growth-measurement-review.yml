name: Growth measurement review (NO DEPLOY)
on:
  push:
    branches: [growth-measurement-readiness-20261012]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node scripts/patch-tracker-growth-measurement.cjs
          node scripts/patch-tracker-growth-measurement.cjs
          node --check src/index.js
          node --check src/tracker-growth-cockpit.cjs
          node tests/tracker-growth-measurement.test.cjs
          node tests/tracker-growth-execution.test.cjs
          git diff --check
      - name: Persist verified canonical source
        run: |
          git add src/index.js
          if ! git diff --cached --quiet; then
            git config user.name contentscale-review-ci
            git config user.email contentscale-review-ci@users.noreply.github.com
            git commit -m "review: verified growth measurement route [skip ci]"
            git push origin HEAD:refs/heads/growth-measurement-readiness-20261012
          fi
