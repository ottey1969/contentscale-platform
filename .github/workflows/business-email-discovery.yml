name: Business email discovery
on:
  pull_request:
    paths:
      - 'src/business-email-discovery*'
      - 'src/services/email-detection-service.js'
      - 'src/ceo-business-email.test.cjs'
      - '.github/workflows/business-email-discovery.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node src/business-email-discovery.test.js
      - run: node src/ceo-business-email.test.cjs
