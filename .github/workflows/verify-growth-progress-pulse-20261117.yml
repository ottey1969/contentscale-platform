name: Verify Growth progress pulse
on:
  push:
    branches: [fix/growth-run-progress-pulse-20261117]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check public/growth-automatic-report-ui.js
      - run: node --test tests/growth-save-run-scroll-summary.test.cjs
