name: Case Study v568 main-based review (NO DEPLOY)
on:
  push:
    branches: [case-study-v568-main-based-review]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-review-only:
    if: github.ref == 'refs/heads/case-study-v568-main-based-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate surgical v568 review from main v567
        run: node scripts/prepare-case-study-v568-main-review.cjs src/index.js
      - name: Syntax and release quarantine check
        run: |
          node --check src/index.js
          node --check index.cjs
          if head -n 4 src/index.js | grep -Fq "staging/safety-gate.cjs"; then
            echo "REFUSED: staging full-app boot fence in production review" >&2
            exit 1
          fi
          grep -Fq "CS-2026-10-10-REVIEW-v568-CASE-FIRST-MANUAL-SCAN" src/index.js
      - name: Run real endpoint isolation and dispatch regression
        run: node --test tests/case-study-v568-review-endpoint.test.cjs
      - name: Commit only validated canonical index to review branch
        run: |
          git config user.name "contentscale-review-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          git diff --cached --quiet && exit 0
          git commit -m "Review only: tested v568 first manual Case Study scan"
          git push origin HEAD:case-study-v568-main-based-review
