name: Inspect Publish and Measure UI entrypoints
on:
  push:
    branches: [fix/growth-publish-measure-simple-20261117]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate markup and client handlers
        run: |
          grep -RIn -C 4 --exclude-dir=.git --exclude='package-lock.json' -E 'Record actual publication|Save publication checkpoint|published_at.*name=|growthPublication' src public | head -240 || true
