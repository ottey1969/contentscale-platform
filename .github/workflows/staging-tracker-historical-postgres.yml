name: Staging Tracker historical integrity — disposable PostgreSQL
on:
  push:
    branches: [tracker-staging]
    paths:
      - 'src/staging/tracker-historical-integrity.cjs'
      - 'tests/staging-tracker-historical-integrity-postgres.cjs'
      - '.github/workflows/staging-tracker-historical-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated PostgreSQL driver
        run: |
          mkdir -p /tmp/contentscale-legacy-driver
          npm install --prefix /tmp/contentscale-legacy-driver --no-save --no-package-lock --ignore-scripts pg@8
      - name: Run historical-integrity tests on disposable database only
        env:
          CI: 'true'
          TRACKER_TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/testdb
          TRACKER_PG_MODULE_PATH: /tmp/contentscale-legacy-driver/node_modules/pg
        run: |
          node --test tests/staging-tracker-historical-integrity.test.cjs
          node tests/staging-tracker-historical-integrity-postgres.cjs
