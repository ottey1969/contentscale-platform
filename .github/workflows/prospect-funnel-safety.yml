name: Prospect funnel safety checks

on:
  push:
    branches:
      - e2e-ceo-quickscan-audit-tracker-case-study
  pull_request:
    paths:
      - 'src/index.js'
      - 'src/prospect/**'
      - 'tests/e2e-*.test.cjs'
      - '.github/workflows/prospect-funnel-safety.yml'

jobs:
  page-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test commercial page eligibility
        run: node tests/e2e-page-quality.test.cjs
      - name: Check canonical funnel markers
        run: node tests/e2e-funnel-contract.test.cjs
