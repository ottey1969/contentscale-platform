name: Growth Unified Intent & Revenue Gate
on:
  pull_request:
    paths:
      - 'src/growth-daily-gsc-import.cjs'
      - 'src/growth-daily-gsc-import.test.cjs'
      - 'src/growth-daily-gsc-reader.cjs'
      - 'src/growth-daily-gsc-reader.test.cjs'
      - 'migrations/growth-gsc-daily-page-evidence.sql'
      - 'src/growth-click-breakthrough.cjs'
      - 'src/growth-click-breakthrough.test.cjs'
      - 'src/growth-intent-revenue.cjs'
      - 'src/growth-intent-revenue.test.cjs'
      - 'src/growth-unified-workflow.cjs'
      - 'src/growth-unified-workflow.test.cjs'
      - 'src/growth-cms-handoff.cjs'
      - 'src/growth-cms-handoff.test.cjs'
      - '.github/workflows/growth-unified-intent-gate.yml'
  push:
    paths:
      - 'src/growth-daily-gsc-import.cjs'
      - 'src/growth-daily-gsc-import.test.cjs'
      - 'src/growth-daily-gsc-reader.cjs'
      - 'src/growth-daily-gsc-reader.test.cjs'
      - 'migrations/growth-gsc-daily-page-evidence.sql'
      - 'src/growth-click-breakthrough.cjs'
      - 'src/growth-click-breakthrough.test.cjs'
      - 'src/growth-intent-revenue.cjs'
      - 'src/growth-intent-revenue.test.cjs'
      - 'src/growth-unified-workflow.cjs'
      - 'src/growth-unified-workflow.test.cjs'
      - 'src/growth-cms-handoff.cjs'
      - 'src/growth-cms-handoff.test.cjs'
      - '.github/workflows/growth-unified-intent-gate.yml'
jobs:
  intent-to-revenue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Existing cross-CMS handoff
        run: node src/growth-cms-handoff.test.cjs
      - name: Intent and offer verification
        run: node src/growth-intent-revenue.test.cjs
      - name: Direct GSC exact-page daily import
        run: node src/growth-daily-gsc-import.test.cjs
      - name: Canonical daily GSC evidence read
        run: node src/growth-daily-gsc-reader.test.cjs
      - name: Settled daily click breakthrough
        run: node src/growth-click-breakthrough.test.cjs
      - name: Production wiring preflight (must pass before release)
        run: node src/growth-production-wiring.preflight.cjs
      - name: One Growth end-to-end handoff
        run: node src/growth-unified-workflow.test.cjs
