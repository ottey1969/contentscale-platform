name: Replace mandatory GSC gate (feature branch only)
on:
  push:
    branches:
      - hotfix/tracker-gsc-modal-20261017
    paths:
      - scripts/fix-tracker-optional-gsc-advice.cjs
      - scripts/tracker-optional-gsc-advice.test.cjs
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/tracker-gsc-modal-20261017
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact canonical replacement
        run: node scripts/fix-tracker-optional-gsc-advice.cjs --write
      - name: Verify optional banner, no overlay, no unintended writes
        run: |
          node scripts/tracker-optional-gsc-advice.test.cjs
          node --check src/index.js
          node --check index.cjs
      - name: Save only verified canonical source on feature branch
        run: |
          git config user.name "contentscale-tracker-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          if ! git diff --cached --quiet; then
            git commit -m "Replace mandatory GSC modal with optional inline recommendation"
            git push origin HEAD:hotfix/tracker-gsc-modal-20261017
          fi
