name: Validate Growth CMS overview choices
on:
  push:
    branches: [fix/growth-cms-overview-not-optional-additions-20261117]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser JavaScript syntax
        run: node --check public/growth-cms-neutral-handoff.js
      - name: Tests
        run: |
          node --test tests/growth-cms-overview-no-auto-add.test.cjs
          node --test tests/growth-cms-query-intent.test.cjs
          node --test tests/growth-cms-obsolete-warning.test.cjs
          node --test tests/growth-proposal-cms-handoff.test.cjs
          node --test tests/growth-sentence-removals.test.cjs
