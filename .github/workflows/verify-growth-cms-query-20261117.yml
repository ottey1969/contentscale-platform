name: Verify Growth CMS selected query and sentence review
on:
  push:
    branches: [fix/growth-cms-query-and-atomic-review-20261117]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/growth-cms-query-intent.cjs
          node --check src/tracker-growth-cms-export.cjs
          node --check public/growth-cms-neutral-handoff.js
          node --check src/tracker-growth-automatic-routes.cjs
      - name: Intent and existing CMS regression tests
        run: |
          node --test tests/growth-cms-query-intent.test.cjs
          node --test tests/growth-cms-obsolete-warning.test.cjs
          node --test tests/growth-proposal-cms-handoff.test.cjs
          node --test tests/growth-sentence-removals.test.cjs
