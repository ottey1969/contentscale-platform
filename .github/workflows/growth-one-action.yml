name: Growth One Action and Intent Safety
on:
  pull_request:
    paths:
      - 'src/growth-one-action-decision*.cjs'
      - 'src/growth-public-search-discovery*.cjs'
      - 'src/growth-optional-google-fallback*.cjs'
      - 'src/growth-reader-task-coverage.cjs'
      - 'src/growth-verified-opportunity.cjs'
      - 'src/growth-owner-handoff-package.cjs'
      - 'src/growth-editorial-decision-gate.cjs'
      - 'src/growth-owner-edit-decision.cjs'
      - 'src/growth-source-grounded-editor.cjs'
      - 'src/growth-serper-only.test.cjs'
      - 'tests/growth-e2e-owner-contract.test.cjs'
      - 'tests/growth-verified-opportunity.test.cjs'
      - 'tests/growth-truncated-evidence.test.cjs'
      - 'tests/growth-claim-guard.test.cjs'
      - 'tests/growth-review-16-regression.test.cjs'
      - 'tests/growth-review-17-regression.test.cjs'
      - 'tests/growth-root-cause-regression.test.cjs'
      - 'tests/growth-final-quality-regression.test.cjs'
      - 'tests/growth-generator-and-shared-tasks.test.cjs'
      - 'tests/growth-evidence-status-safety-regression.test.cjs'
      - 'tests/fixtures/growth-reports-2-4.json'
      - 'src/growth-text.cjs'
      - 'tests/fixtures/growth-root-cause/**'
      - 'src/growth-query-selection.cjs'
      - 'src/growth-serp-quality.cjs'
      - 'tests/fixtures/growth-review-17-production.json'
      - 'tests/fixtures/growth-review-16/**'
      - 'tests/growth-industry-neutrality.test.cjs'
      - 'tests/growth-local-service-pipeline.test.cjs'
      - 'src/growth-draft-claim-guard.cjs'
      - 'src/growth-derived-reader-tasks.cjs'
      - 'src/growth-intent-signals.cjs'
      - 'tests/fixtures/growth-export-27/**'
      - 'src/growth-public-html-reader.cjs'
      - 'src/growth-practical-brief.cjs'
      - 'src/growth-autonomous-opportunity*.cjs'
      - 'tests/growth-live-query-competitors.test.cjs'
      - 'tests/tracker-growth-automatic-research.test.cjs'
      - 'tests/growth-self-destination-identity.test.cjs'
      - 'src/growth-automatic-analysis.cjs'
      - 'public/growth-automatic-report-ui.js'
      - 'src/tracker-growth-automatic-routes.cjs'
      - 'src/growth-evidence-status.cjs'
      - 'src/growth-url-identity.cjs'
      - 'tests/tracker-redirect-advice.test.cjs'
      - 'tests/growth-destination-lock.test.cjs'
      - 'src/growth-safe-browser-renderer.cjs'
      - 'tests/growth-reports-11-12-regression.test.cjs'
      - 'tests/fixtures/growth-reports-11-12/**'
      - 'package.json'
      - '.github/workflows/growth-one-action.yml'
  push:
    branches: [main]
    paths:
      - 'src/growth-one-action-decision*.cjs'
      - 'src/growth-public-search-discovery*.cjs'
      - 'src/growth-optional-google-fallback*.cjs'
      - 'src/growth-reader-task-coverage.cjs'
      - 'src/growth-verified-opportunity.cjs'
      - 'src/growth-owner-handoff-package.cjs'
      - 'src/growth-editorial-decision-gate.cjs'
      - 'src/growth-owner-edit-decision.cjs'
      - 'src/growth-source-grounded-editor.cjs'
      - 'src/growth-serper-only.test.cjs'
      - 'tests/growth-e2e-owner-contract.test.cjs'
      - 'tests/growth-verified-opportunity.test.cjs'
      - 'tests/fixtures/growth-export-27/**'
      - 'src/growth-public-html-reader.cjs'
      - 'src/growth-practical-brief.cjs'
      - 'src/growth-autonomous-opportunity*.cjs'
      - 'tests/growth-live-query-competitors.test.cjs'
      - 'tests/tracker-growth-automatic-research.test.cjs'
      - 'tests/growth-self-destination-identity.test.cjs'
      - 'src/growth-automatic-analysis.cjs'
      - 'public/growth-automatic-report-ui.js'
      - 'src/tracker-growth-automatic-routes.cjs'
      - 'src/growth-evidence-status.cjs'
      - 'src/growth-url-identity.cjs'
      - 'tests/tracker-redirect-advice.test.cjs'
      - 'tests/growth-destination-lock.test.cjs'
      - 'src/growth-safe-browser-renderer.cjs'
      - 'tests/growth-reports-11-12-regression.test.cjs'
      - 'tests/fixtures/growth-reports-11-12/**'
      - 'package.json'
      - '.github/workflows/growth-one-action.yml'
jobs:
  evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical read-only Growth recommendation regression
        run: node src/growth-one-action-decision.test.cjs
      - name: Public query discovery, no paid provider and live competitor route
        run: |
          node src/growth-public-search-discovery.test.cjs
          node src/growth-optional-google-fallback.test.cjs
          node tests/growth-live-query-competitors.test.cjs
          node tests/tracker-growth-automatic-research.test.cjs
          node --test tests/growth-self-destination-identity.test.cjs
          node src/growth-serper-only.test.cjs
      - name: Evidence-based decision, verified opportunity producer and owner GET-POST-UI contract
        run: |
          node --test tests/growth-core-decision-contract.test.cjs tests/growth-owner-edit-decision.test.cjs tests/growth-verified-opportunity.test.cjs tests/growth-truncated-evidence.test.cjs tests/growth-claim-guard.test.cjs tests/growth-review-16-regression.test.cjs tests/growth-review-17-regression.test.cjs tests/growth-root-cause-regression.test.cjs tests/growth-final-quality-regression.test.cjs tests/growth-generator-and-shared-tasks.test.cjs tests/growth-industry-neutrality.test.cjs tests/growth-local-service-pipeline.test.cjs tests/growth-e2e-owner-contract.test.cjs
          node --test tests/growth-core-decision-contract.test.cjs tests/growth-owner-edit-decision.test.cjs tests/growth-verified-opportunity.test.cjs tests/growth-truncated-evidence.test.cjs tests/growth-claim-guard.test.cjs tests/growth-review-16-regression.test.cjs tests/growth-review-17-regression.test.cjs tests/growth-root-cause-regression.test.cjs tests/growth-final-quality-regression.test.cjs tests/growth-industry-neutrality.test.cjs tests/growth-local-service-pipeline.test.cjs tests/growth-e2e-owner-contract.test.cjs
      - name: Reports 11/12 regressions (intent, destination, market, readable HTML, evidence status)
        run: node --test tests/growth-reports-11-12-regression.test.cjs tests/growth-evidence-status-safety-regression.test.cjs tests/tracker-redirect-advice.test.cjs tests/growth-destination-lock.test.cjs
      - name: Full repository test chain (npm test)
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm ci --ignore-scripts
          npm test
      - name: New and existing client JS syntax
        run: |
          node --check src/growth-one-action-decision.cjs
          node --check src/growth-public-search-discovery.cjs
          node --check src/growth-practical-brief.cjs
          node --check src/growth-public-html-reader.cjs
          node --check src/growth-automatic-analysis.cjs
          node --check src/tracker-growth-automatic-routes.cjs
          node --check src/growth-evidence-status.cjs
          node --check public/growth-automatic-report-ui.js
