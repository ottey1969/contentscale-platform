name: Direct GSC growth integration review (NO DEPLOY)
on:
  push:
    branches: [growth-gsc-direct-20261012]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Register verified direct GSC importer in canonical server
        run: |
          node scripts/patch-growth-gsc-direct.cjs
          node scripts/patch-growth-gsc-direct.cjs
          node --check src/index.js
          node --check src/tracker-growth-gsc-direct.cjs
          node --check src/tracker-growth-measurement.cjs
          node tests/tracker-growth-gsc-direct.test.cjs
          node tests/tracker-growth-dated-windows.test.cjs
          node tests/tracker-growth-measurement.test.cjs
          git diff --check
      - name: Persist only verified canonical source on review branch
        run: |
          git add src/index.js
          if ! git diff --cached --quiet; then
            git config user.name contentscale-review-ci
            git config user.email contentscale-review-ci@users.noreply.github.com
            git commit -m "review: tested direct GSC Growth importer [skip ci]"
            git push origin HEAD:refs/heads/growth-gsc-direct-20261012
          fi
