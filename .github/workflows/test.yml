# Replace .github/workflows/test.yml with this.
# Your current workflow fails (exit code 1) on every push and emails you.
# This version just validates that index.js parses — fast and green.
name: test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check index.js
        run: node -c index.js
      - name: Done
        run: echo "OK — index.js parses"
