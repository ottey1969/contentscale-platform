name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No npm install needed — the test suites have no required dependencies
      # (google-auth-library is loaded lazily only when you fetch a live token).
      - name: brief-quality tests
        run: node brief-quality.test.js
      - name: gsc-client tests
        run: node gsc-client.test.js
