# Replace .github/workflows/test.yml with this.
# Your current workflow fails (exit code 1) on every push and emails you.
# This version just validates that index.js parses — fast and green.
name: test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check index.js
        run: node -c index.js
      - name: CEO public/private input regression and syntax
        run: node --test tests/ceo-domain-form.test.cjs
      - name: Golden owner cases (AGENTS.md) — must stay green for every change
        run: node --test tests/golden-owner-cases.test.cjs
      - name: Case Study closeout stops scans and requires explicit owner consent
        run: node --test tests/tracker-case-study-scan-consent.test.cjs
      - name: Cookie banner follows the page language (nl/es)
        run: node --test tests/consent-widget-language.test.cjs
      - name: Tracker sign-up works from nl. and es. (CORS)
        run: node --test tests/cors-language-subdomains.test.cjs
      - name: A tracker only takes in URLs of its own domain
        run: node --test tests/tracker-domain-guard.test.cjs
      - name: Install dependencies for API regressions
        run: npm ci --ignore-scripts
      - name: Gemini Live credentials and provider failure regression
        run: node --test tests/gemini-live-token.test.cjs
      - name: GSC and Brief quality regressions
        run: npm run test:quality
      - name: Lint browser and server source
        run: npm run lint
      - name: Done
        run: echo "OK — CEO domain boundary and startup syntax verified"
