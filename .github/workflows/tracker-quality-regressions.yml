  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and canonical entry
        run: |
          node --check index.cjs
          node --check src/index.js
          node --check src/brief-quality.js
          node --check src/brief-quality-hook.js
          node --check src/tracker-growth-plan.cjs
          node --check src/tracker-growth-cms-export.cjs
          node --check src/growth-source-grounded-editor.cjs
          node --check src/tracker-growth-snapshot-signals.cjs
          node --check src/growth-public-html-reader.cjs
          node --check src/growth-automatic-analysis.cjs
          node --check src/tracker-growth-automatic-routes.cjs
          node --check src/growth-research-handoff-suggestions.cjs
          node --check public/growth-automatic-report-ui.js
          node --check public/growth-cms-neutral-handoff.js
          node --check public/tracker-growth-ui.js
      - name: Verified cannibalization and ranking/CTR diagnosis
        run: |
          node src/brief-quality.test.js
          node tests/tracker-cannib-evidence.test.cjs
      - name: Zero-action closure, no recycling, growth proof
        run: |
          node tests/tracker-growth-plan.test.cjs
          node tests/tracker-growth-integration.test.cjs
          node tests/tracker-completed-actions.test.cjs
          node tests/tracker-growth-closeout-handler.test.cjs
          node tests/tracker-case-study-freshness.test.cjs
          node tests/tracker-growth-cockpit.test.cjs
          node tests/tracker-growth-best-candidate.test.cjs
          node scripts/tracker-optional-gsc-advice.test.cjs
          node scripts/canonical-page-journey.test.cjs
          node tests/tracker-canonical-journey-pure.test.cjs
          node tests/tracker-growth-no-gsc-access.test.cjs
          node scripts/tracker-readonly-access.test.cjs
          node scripts/tracker-growth-navigation.test.cjs
          node tests/tracker-growth-locale-round2.test.cjs
          node tests/tracker-growth-execution.test.cjs
          node tests/tracker-growth-measurement.test.cjs
          node tests/tracker-growth-no-gsc-research.test.cjs
          node src/growth-cms-handoff.test.cjs
          node tests/tracker-growth-cms-export.test.cjs
          node tests/growth-source-grounded-editor.test.cjs
          node tests/growth-source-grounded-editor-route.test.cjs
          node tests/growth-auto-owner-draft-export.test.cjs
          node tests/growth-owner-direct-complete-ui.test.cjs
          node src/growth-editorial-research-context.test.cjs
          node src/growth-optional-gsc-draft-evidence.test.cjs
          node tests/tracker-growth-export-canonical-scope.test.cjs
          node tests/tracker-growth-cms-manual-source.test.cjs
          node tests/tracker-growth-cms-live-source.test.cjs
          node tests/tracker-growth-snapshot-signals.test.cjs
          node tests/tracker-growth-automatic-research.test.cjs
          node tests/growth-research-handoff-suggestions.test.cjs
          node src/growth-live-routes.test.cjs
          node src/growth-canonical-loader-optional.test.cjs
          node tests/growth-intent-site-graph.test.cjs
          node tests/tracker-growth-measurement-share.test.cjs
          node tests/tracker-growth-dated-windows.test.cjs
          node tests/tracker-growth-gsc-direct.test.cjs
