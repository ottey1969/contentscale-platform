name: Inspect Growth stale-page user-visible alert
on:
  push:
    branches: [fix/growth-stale-page-inline-rerun-20261117]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate stale page message renderer
        run: |
          grep -RIn -C 4 --exclude-dir=.git --exclude='package-lock.json' -E "Not written:|Not written|Your page.s headings changed|PAGE_HEADINGS_CHANGED|no longer found" public src tests | head -240 || true
