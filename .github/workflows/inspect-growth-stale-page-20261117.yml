name: Verify inline Growth research refresh for rewritten pages
on:
  push:
    branches: [fix/growth-stale-page-inline-rerun-20261117]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser scripts syntax
        run: |
          node --check public/growth-gap-checklist.js
          node --check public/growth-automatic-report-ui.js
      - name: Stale page and Growth workflow tests
        run: |
          node --test tests/growth-stale-page-inline-rerun.test.cjs
          node --test tests/growth-first-screen.test.cjs
          node --test tests/growth-save-run-scroll-summary.test.cjs
          node --test tests/growth-prewrite-ai-evidence.test.cjs
