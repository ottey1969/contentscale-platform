name: Promote safe Tracker GET to staging canonical source
on:
  push:
    branches: [tracker-staging]
    paths:
      - '.github/workflows/staging-apply-tracker-get.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  promote-get:
    if: github.ref == 'refs/heads/tracker-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm exclusive staging checkout
        run: |
          test "${GITHUB_REF_NAME}" = "tracker-staging"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
      - name: Generate read-only GET from canonical source
        run: |
          node tests/staging-tracker-readonly-get-candidate.cjs src/index.js /tmp/contentscale-readonly-get-candidate.js
          node --check /tmp/contentscale-readonly-get-candidate.js
      - name: Prove route behavior with mocked database
        run: |
          node --test tests/staging-tracker-readonly-get-candidate.test.cjs
          PATCHED_CANONICAL_FILE=src/index.js node --test tests/staging-tracker-patched-handlers.test.cjs
      - name: Replace only the canonical staging entrypoint
        run: |
          cp /tmp/contentscale-readonly-get-candidate.js src/index.js
          git diff --check
          node --check src/index.js
          test "$(git diff --name-only)" = "src/index.js"
      - name: Check canonical staging regressions
        run: |
          node --test tests/staging-tracker-canonical-handlers.test.cjs
          PATCHED_GET=src/index.js node --test tests/staging-tracker-readonly-get-candidate.test.cjs
          PATCHED_CANONICAL_FILE=src/index.js node --test tests/staging-tracker-patched-handlers.test.cjs
      - name: Commit exclusively to tracker-staging
        run: |
          git config user.name "contentscale-staging-ci"
          git config user.email "contentscale-staging-ci@users.noreply.github.com"
          git add -- src/index.js
          git commit -m "staging: prevent Tracker GET from performing implicit repairs"
          git push origin HEAD:refs/heads/tracker-staging
