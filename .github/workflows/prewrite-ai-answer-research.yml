name: Pre-Write AI Answer Research Contract
on:
  pull_request:
    paths:
      - 'src/prewrite-ai-answer-research.cjs'
      - 'src/prewrite-brief-research.cjs'
      - 'src/index.js'
      - 'tests/fixtures/prewrite-legacy-inline-*.cjs'
      - 'scripts/prepare-canonical-production.cjs'
      - 'package.json'
      - 'tests/prewrite-ai-answer-*.test.cjs'
      - 'tests/prewrite-research-*.test.cjs'
      - 'tests/prewrite-brief-research-*.test.cjs'
      - 'tests/prewrite-production-findings.test.cjs'
      - 'tests/prewrite-expand-existing.test.cjs'
      - 'tests/tracker-case-study-end-e2e.test.cjs'
      - 'tests/growth-cms-handoff-zero-statements.test.cjs'
      - 'tests/tracker-growth-personal-voice.test.cjs'
      - 'tests/tracker-growth-flagged-remove-all.test.cjs'
      - 'tests/tracker-growth-clear-flow.test.cjs'
      - 'tests/tracker-growth-flagged-keep.test.cjs'
      - 'src/growth-sentence-removal-store.cjs'
      - 'src/tracker-growth-cms-export.cjs'
      - 'public/growth-automatic-report-ui.js'
      - 'public/growth-gap-checklist.js'
      - 'tests/growth-free-e2e.test.cjs'
      - 'src/growth-free/**'
      - 'public/growth-cms-neutral-handoff.html'
      - 'public/growth-cms-neutral-handoff.js'
      - 'src/prewrite-existing-page.cjs'
      - 'src/tracker-growth-automatic-routes.cjs'
      - 'tests/staging-boot-no-egress.cjs'
      - 'tests/prewrite-e2e-gemini-stub.cjs'
      - 'public/prewrite-ai-answer-research.js'
      - 'public/prewrite-research-tab.js'
      - '.github/workflows/prewrite-ai-answer-research.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/prewrite-ai-answer-research.cjs'
      - 'src/prewrite-brief-research.cjs'
      - 'src/index.js'
      - 'tests/fixtures/prewrite-legacy-inline-*.cjs'
      - 'scripts/prepare-canonical-production.cjs'
      - 'tests/prewrite-ai-answer-*.test.cjs'
      - 'tests/prewrite-research-*.test.cjs'
      - 'tests/prewrite-brief-research-*.test.cjs'
      - 'tests/prewrite-production-findings.test.cjs'
      - 'tests/prewrite-expand-existing.test.cjs'
      - 'tests/tracker-case-study-end-e2e.test.cjs'
      - 'tests/growth-cms-handoff-zero-statements.test.cjs'
      - 'tests/tracker-growth-personal-voice.test.cjs'
      - 'tests/tracker-growth-flagged-remove-all.test.cjs'
      - 'tests/tracker-growth-clear-flow.test.cjs'
      - 'tests/tracker-growth-flagged-keep.test.cjs'
      - 'src/growth-sentence-removal-store.cjs'
      - 'src/tracker-growth-cms-export.cjs'
      - 'public/growth-automatic-report-ui.js'
      - 'public/growth-gap-checklist.js'
      - 'tests/growth-free-e2e.test.cjs'
      - 'src/growth-free/**'
      - 'public/growth-cms-neutral-handoff.html'
      - 'public/growth-cms-neutral-handoff.js'
      - 'src/prewrite-existing-page.cjs'
      - 'src/tracker-growth-automatic-routes.cjs'
      - 'tests/staging-boot-no-egress.cjs'
      - 'tests/prewrite-e2e-gemini-stub.cjs'
      - 'public/prewrite-ai-answer-research.js'
      - 'public/prewrite-research-tab.js'
jobs:
  prewrite-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate 5-system writing research, canonical integration and the migration reference
        run: node --test tests/prewrite-brief-decision-on-top.test.cjs tests/prewrite-ai-answer-research.test.cjs tests/prewrite-ai-answer-integration.test.cjs tests/prewrite-research-prompt-contract.test.cjs tests/prewrite-brief-research-migration.test.cjs tests/prewrite-ai-answer-validation.test.cjs tests/prewrite-production-findings.test.cjs tests/prewrite-expand-existing.test.cjs
      - name: Research Prompt tab in a real browser (real Pre-Write markup from the canonical build)
        run: npm install --no-save --no-package-lock playwright@1.47.2 && npx playwright install --with-deps chromium && node --test tests/prewrite-research-tab-browser.test.cjs tests/growth-cms-handoff-zero-statements.test.cjs tests/tracker-growth-personal-voice.test.cjs tests/tracker-growth-flagged-remove-all.test.cjs tests/tracker-growth-clear-flow.test.cjs tests/tracker-growth-flagged-keep.test.cjs
      - name: Verify idempotent canonical build
        run: node scripts/prepare-canonical-production.cjs --verify-only
      - name: Execute Railway Railpack build step and syntax-check built server
        run: npm run build && node --check src/index.js
  prewrite-staging-e2e:
    # Full canonical server on localhost, outside network denied, disposable PostgreSQL; TEST rows only. No deploy.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: prewrite_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d prewrite_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      PREWRITE_E2E_DATABASE_URL: postgres://test:test@127.0.0.1:5432/prewrite_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies without scripts
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Pre-Write research through the real server routes (Tracker page, Complete missing only, reopen)
        run: node --test tests/prewrite-brief-research-e2e.test.cjs tests/tracker-case-study-end-e2e.test.cjs
      - name: Free Growth end to end in a real browser against PostgreSQL (no Tracker writes)
        run: npm install --no-save --no-package-lock playwright@1.47.2 && npx playwright install --with-deps chromium && node --test tests/growth-free-e2e.test.cjs
