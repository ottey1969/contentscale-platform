name: Pre-Write AI Answer Research Contract
on:
  pull_request:
    paths:
      - 'src/prewrite-ai-answer-research.cjs'
      - 'scripts/patch-prewrite-ai-answer-research.cjs'
      - 'scripts/prepare-canonical-production.cjs'
      - 'package.json'
      - 'tests/prewrite-ai-answer-*.test.cjs'
      - 'tests/prewrite-research-*.test.cjs'
      - 'public/prewrite-ai-answer-research.js'
      - 'public/prewrite-research-tab.js'
      - '.github/workflows/prewrite-ai-answer-research.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/prewrite-ai-answer-research.cjs'
      - 'scripts/patch-prewrite-ai-answer-research.cjs'
      - 'scripts/prepare-canonical-production.cjs'
      - 'tests/prewrite-ai-answer-*.test.cjs'
      - 'tests/prewrite-research-*.test.cjs'
      - 'public/prewrite-ai-answer-research.js'
      - 'public/prewrite-research-tab.js'
jobs:
  prewrite-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate 5-system writing research and canonical integration
        run: node --test tests/prewrite-ai-answer-research.test.cjs tests/prewrite-ai-answer-integration.test.cjs tests/prewrite-research-prompt-contract.test.cjs
      - name: Research Prompt tab in a real browser (real Pre-Write markup from the canonical build)
        run: npm install --no-save --no-package-lock playwright@1.47.2 && npx playwright install --with-deps chromium && node --test tests/prewrite-research-tab-browser.test.cjs
      - name: Verify idempotent canonical build
        run: node scripts/prepare-canonical-production.cjs --verify-only
      - name: Execute Railway Railpack build step and syntax-check built server
        run: npm run build && node --check src/index.js
