name: Growth Evidence and Render Gate
on:
  pull_request:
    paths:
      - 'src/growth-evidence-*.cjs'
      - '.github/workflows/growth-evidence-gate.yml'
  workflow_dispatch:
jobs:
  growth-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Evidence contract tests
        run: node src/growth-evidence-contract.test.cjs
      - name: Draft and rendered-template guard tests
        run: node src/growth-evidence-render-gate.test.cjs
