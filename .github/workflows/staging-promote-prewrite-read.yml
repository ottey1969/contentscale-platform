name: Promote read-only Prewrite GET and authorized Finalize
on:
  push:
    branches: [tracker-staging]
    paths:
      - '.github/workflows/staging-promote-prewrite-read.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  promote:
    if: github.ref == 'refs/heads/tracker-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail closed unless isolated staging branch
        run: |
          test "${GITHUB_REF_NAME}" = "tracker-staging"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          test -z "${DATABASE_URL:-}"
      - name: Prepare and verify nonwriting recovery candidate
        run: |
          node tests/staging-prewrite-pure-get-candidate.cjs src/index.js /tmp/contentscale-prewrite-pure-get.js
          node --check /tmp/contentscale-prewrite-pure-get.js
          node --test tests/staging-prewrite-pure-get.test.cjs
      - name: Apply only canonical staging source
        run: |
          cp /tmp/contentscale-prewrite-pure-get.js src/index.js
          node --check src/index.js
          git diff --check
          test "$(git diff --name-only)" = "src/index.js"
      - name: Verify actual saved Brief GET and Finalize handlers after replacement
        run: |
          PREWRITE_CANDIDATE_FILE=src/index.js node --test tests/staging-prewrite-pure-get.test.cjs
          node --test tests/staging-tracker-readonly-coverage.test.cjs tests/staging-tracker-release-decision.test.cjs
          node --test tests/staging-tracker-canonical-handlers.test.cjs
          PATCHED_GET=src/index.js node --test tests/staging-tracker-readonly-get-candidate.test.cjs
          PATCHED_CANONICAL_FILE=src/index.js node --test tests/staging-tracker-patched-handlers.test.cjs
          EVENT_CANDIDATE_FILE=src/index.js node --test tests/staging-tracker-event-candidate.test.cjs
          SITEMAP_CANDIDATE_FILE=src/index.js node --test tests/staging-tracker-sitemap-candidate.test.cjs
          CASE_CANDIDATE=src/index.js node --test tests/staging-tracker-case-reads.test.cjs
      - name: Commit only tested change to tracker-staging
        run: |
          git config user.name "contentscale-staging-ci"
          git config user.email "contentscale-staging-ci@users.noreply.github.com"
          git add -- src/index.js
          git commit -m "staging: preview saved Brief recovery on GET, persist through existing Finalize"
          git push origin HEAD:refs/heads/tracker-staging
# Retry after updating canonical Prewrite GET release-contract assertions.
