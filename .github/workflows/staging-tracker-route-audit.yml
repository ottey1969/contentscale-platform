name: Staging Tracker canonical route audit
on:
  push:
    branches: [tracker-staging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inventory sitemap UI/backend usage before applying candidate
        run: node tests/staging-tracker-sitemap-callsite-audit.cjs
      - name: Read narrow sitemap handler for safe GET POST split
        run: node tests/staging-tracker-sitemap-get-full-audit.cjs
      - name: Build sitemap GET POST single-handler candidate
        run: |
          node tests/staging-tracker-sitemap-candidate.cjs src/index.js /tmp/contentscale-sitemap-candidate.js
          node --check /tmp/contentscale-sitemap-candidate.js
          node --test tests/staging-tracker-sitemap-candidate.test.cjs
      - name: Audit sitemap source and event side-effect paths
        run: node tests/staging-tracker-sitemap-source-audit.cjs
      - name: Inspect app entrypoint ordering without running app
        run: node tests/staging-tracker-boot-top-audit.cjs
      - name: Verify existing case-study start ownership and legacy attach handling
        run: node tests/staging-tracker-case-study-start-audit.cjs
      - name: Trace legacy case-study mutations without app boot
        run: node tests/staging-tracker-historical-writer-audit.cjs
      - name: Prepare and test read-only case-study GET candidate
        run: |
          node tests/staging-tracker-case-reads-candidate.cjs src/index.js /tmp/contentscale-case-reads.js
          node --check /tmp/contentscale-case-reads.js
          node --test tests/staging-tracker-case-reads.test.cjs
      - name: Inspect case study GET handlers and schema helpers
        run: node tests/staging-case-study-get-source.cjs
      - name: Map existing explicit Prewrite maintenance route and owner scopes
        run: node tests/staging-prewrite-existing-maintenance-map.cjs
      - name: Review implicit Prewrite brief writes before deciding migration
        run: node tests/staging-prewrite-get-review.cjs
      - name: Discover remaining tracker GET write sources
        run: node tests/staging-tracker-remaining-get-audit.cjs
      - name: Read-only canonical route inventory
        run: node tests/staging-tracker-route-audit.cjs
      - name: Examine canonical Tracker handler risk markers
        run: node tests/staging-tracker-handler-audit.cjs
      - name: Run isolated canonical Tracker handler regression tests
        run: node --test tests/staging-tracker-canonical-handlers.test.cjs
      - name: Generate surgical Tracker patch candidate without modifying repository
        run: node tests/staging-tracker-surgical-patch.cjs src/index.js /tmp/contentscale-staging-tracker-patched.js && node --check /tmp/contentscale-staging-tracker-patched.js
      - name: Validate patched canonical Tracker handlers
        run: node --test tests/staging-tracker-patched-handlers.test.cjs
      - name: Build atomic Tracker event candidate without source changes
        run: |
          node tests/staging-tracker-event-candidate.cjs src/index.js /tmp/contentscale-event-candidate.js
          node --check /tmp/contentscale-event-candidate.js
          node --test tests/staging-tracker-event-candidate.test.cjs
      - name: Build and syntax-check GET read-only candidate
        run: |
          node tests/staging-tracker-readonly-get-candidate.cjs src/index.js /tmp/contentscale-readonly-get-candidate.js
          node --check /tmp/contentscale-readonly-get-candidate.js
          node --test tests/staging-tracker-readonly-get-candidate.test.cjs
      - name: Inspect read route helper call graph
        run: node tests/staging-tracker-get-calls.cjs
      - name: Inspect critical canonical Tracker GET ranges
        run: node tests/staging-tracker-get-regions.cjs
      - name: Inventory Tracker GET side effects without executing route
        run: node tests/staging-tracker-get-sideeffects-audit.cjs
      - name: Examine narrow canonical manual-done handlers
        run: node tests/staging-tracker-manual-handler-source-audit.cjs
      - name: Verify staging canonical handlers already patched
        run: |
          grep -Fq 'manual_done IS DISTINCT FROM $1' src/index.js
          grep -Fq "status NOT IN ('deleted','paused','disabled')" src/index.js
          PATCHED_CANONICAL_FILE=src/index.js node --test tests/staging-tracker-patched-handlers.test.cjs
