name: Staging Tracker canonical route audit
on:
  push:
    branches: [tracker-staging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only canonical route inventory
        run: node tests/staging-tracker-route-audit.cjs
