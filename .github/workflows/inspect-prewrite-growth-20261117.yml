name: Verify Pre-Write to Growth AI evidence
on:
  push:
    branches: [feat/prewrite-growth-ai-evidence-20261117]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax tests
        run: |
          node --check src/growth-prewrite-ai-evidence.cjs
          node --check src/tracker-growth-automatic-routes.cjs
          node --check public/growth-automatic-report-ui.js
      - name: Integration regression tests
        run: |
          node --test tests/growth-prewrite-ai-evidence.test.cjs
          node --test tests/growth-ai-check-validation.test.cjs
          node --test tests/growth-ai-relevance.test.cjs
          node --test tests/prewrite-ai-answer-integration.test.cjs
          node --test src/growth-live-routes.test.cjs
