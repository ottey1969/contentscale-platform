name: Growth execution review (NO DEPLOY)
on:
  push:
    branches: [growth-execution-tracking-20261012]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node scripts/patch-tracker-growth-execution.cjs src/index.js
          node scripts/patch-tracker-growth-execution.cjs src/index.js
          node --check src/index.js
          node --check src/tracker-growth-cockpit.cjs
          node tests/tracker-growth-execution.test.cjs
          node tests/tracker-growth-cockpit.test.cjs
          git diff --check
      - name: Persist reviewed integration on branch
        run: |
          git add src/index.js
          if ! git diff --cached --quiet; then
            git config user.name contentscale-review-ci
            git config user.email contentscale-review-ci@users.noreply.github.com
            git commit -m "review: tested growth publication route [skip ci]"
            git push origin HEAD:refs/heads/growth-execution-tracking-20261012
          fi
