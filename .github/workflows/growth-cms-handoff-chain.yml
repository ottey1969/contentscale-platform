name: Growth proposal to CMS handoff (PostgreSQL chain)
on:
  pull_request:
    paths:
      - 'src/growth-*.cjs'
      - 'src/tracker-growth-*.cjs'
      - 'src/growth-free/store.cjs'
      - 'public/growth-cms-neutral-handoff.*'
      - 'public/growth-automatic-report-ui.js'
      - 'tests/growth-proposal-cms-handoff.test.cjs'
      - 'tests/growth-cms-chain-postgres.test.cjs'
      - 'tests/growth-report-51-review-regression.test.cjs'
      - 'tests/fixtures/growth-report-50/**'
      - 'tests/fixtures/growth-report-51/**'
      - 'tests/growth-report-52-regression.test.cjs'
      - 'tests/fixtures/growth-report-52/**'
      - 'tests/growth-report-53-regression.test.cjs'
      - 'tests/fixtures/growth-report-53/**'
      - 'tests/growth-report-54-regression.test.cjs'
      - 'tests/growth-task-meaning.test.cjs'
      - 'tests/growth-competitor-overview.test.cjs'
      - 'tests/growth-selected-writing.test.cjs'
      - 'tests/growth-selection-write-route.test.cjs'
      - 'public/growth-gap-checklist.js'
      - 'public/growth-competitor-overview.js'
      - 'tests/helpers/**'
      - 'tests/fixtures/growth-report-55/**'
      - 'tests/fixtures/growth-report-54/**'
      - 'tests/growth-report-55-regression.test.cjs'
      - 'tests/growth-report-56-regression.test.cjs'
      - 'tests/growth-search-market.test.cjs'
      - 'tests/growth-review-221-design.test.cjs'
      - 'tests/growth-new-page.test.cjs'
      - 'tests/growth-page-2324-grouping.test.cjs'
      - 'tests/growth-relevance-and-evidence.test.cjs'
      - 'tests/growth-one-engine.test.cjs'
      - 'tests/growth-serp-titles.test.cjs'
      - 'tests/growth-next-pages.test.cjs'
      - 'tests/growth-edit-copy.test.cjs'
      - 'tests/growth-publication-readiness.test.cjs'
      - 'tests/growth-ai-relevance.test.cjs'
      - 'tests/growth-tracker-ai-check.test.cjs'
      - 'tests/growth-outcome.test.cjs'
      - 'tests/growth-subject-check.test.cjs'
      - 'tests/growth-acceptance.test.cjs'
      - 'src/growth-acceptance.cjs'
      - 'tests/fixtures/growth-acceptance/**'
      - 'tests/fixtures/growth-report-65/**'
      - 'src/growth-competitor-overview.cjs'
      - 'tests/growth-provider-intent.test.cjs'
      - 'tests/growth-site-markets.test.cjs'
      - 'src/growth-market-store.cjs'
      - 'tests/fixtures/growth-report-66/**'
      - 'tests/fixtures/growth-report-67/**'
      - 'src/growth-reader-task-coverage.cjs'
      - 'src/growth-outcome.cjs'
      - 'tests/fixtures/growth-report-64/**'
      - 'src/growth-ai-answers-store.cjs'
      - 'src/growth-publication-readiness.cjs'
      - 'src/growth-ai-relevance.cjs'
      - 'public/growth-edit-copy.js'
      - 'tests/fixtures/growth-report-62/**'
      - 'tests/fixtures/growth-report-63/**'
      - 'src/growth-next-pages.cjs'
      - 'src/growth-serp-titles.cjs'
      - 'tests/fixtures/growth-free-VXX4OBTnFHi2/**'
      - 'src/growth-free/**'
      - 'tests/fixtures/growth-report-61/**'
      - 'tests/fixtures/growth-free-mAOlLCrU07Jv/**'
      - 'tests/fixtures/growth-free-5M0tfxjeQawH/**'
      - 'tests/fixtures/growth-page-2324-2026-10-30/**'
      - 'public/growth-new-page-ui.js'
      - 'tests/growth-selection-store-postgres.test.cjs'
      - 'tests/fixtures/growth-report-55/**'
      - 'package.json'
      - '.github/workflows/growth-cms-handoff-chain.yml'
  push:
    branches: [main]
    paths:
      - 'src/growth-*.cjs'
      - 'src/tracker-growth-*.cjs'
      - 'public/growth-cms-neutral-handoff.*'
jobs:
  cms-handoff-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: growth_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (no browser download)
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci --ignore-scripts
      - name: UI scripts parse
        run: node --check public/growth-cms-neutral-handoff.js && node --check public/growth-automatic-report-ui.js && node --check public/growth-edit-copy.js && node --check public/growth-competitor-overview.js && node --check public/growth-gap-checklist.js && node --check public/growth-new-page-ui.js
      - name: Proposal store and CMS package (report 50)
        run: node --test tests/growth-proposal-cms-handoff.test.cjs tests/growth-report-51-review-regression.test.cjs tests/growth-report-52-regression.test.cjs tests/growth-report-53-regression.test.cjs tests/growth-report-54-regression.test.cjs tests/growth-report-55-regression.test.cjs tests/growth-report-56-regression.test.cjs tests/growth-search-market.test.cjs tests/growth-review-221-design.test.cjs tests/growth-new-page.test.cjs tests/growth-page-2324-grouping.test.cjs tests/growth-relevance-and-evidence.test.cjs tests/growth-one-engine.test.cjs tests/growth-serp-titles.test.cjs tests/growth-next-pages.test.cjs tests/growth-edit-copy.test.cjs tests/growth-publication-readiness.test.cjs tests/growth-ai-relevance.test.cjs tests/growth-tracker-ai-check.test.cjs tests/growth-outcome.test.cjs tests/growth-subject-check.test.cjs tests/growth-acceptance.test.cjs tests/growth-provider-intent.test.cjs tests/growth-site-markets.test.cjs tests/growth-task-meaning.test.cjs tests/growth-competitor-overview.test.cjs tests/growth-selected-writing.test.cjs tests/growth-selection-write-route.test.cjs
      - name: Research -> proposal -> CMS package -> publication without GSC -> Cockpit -> measurement (real PostgreSQL)
        env:
          GROWTH_E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/growth_e2e
        run: node --test tests/growth-cms-chain-postgres.test.cjs
      - name: Selection and market stores (real PostgreSQL)
        env:
          GROWTH_E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/growth_e2e
        run: node --test tests/growth-selection-store-postgres.test.cjs
      - name: Existing publication, export and Cockpit tests
        run: |
          node tests/tracker-growth-execution.test.cjs
          node tests/tracker-growth-measurement.test.cjs
          node --test tests/tracker-growth-cockpit.test.cjs tests/tracker-growth-best-candidate.test.cjs tests/tracker-growth-automatic-research.test.cjs tests/growth-local-service-pipeline.test.cjs
