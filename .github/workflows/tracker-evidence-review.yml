name: Tracker evidence review (NO DEPLOY)
on:
  push:
    branches: [tracker-evidence-growth-20261011]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply evidence-safe canonical cannibalization change
        run: |
          node scripts/patch-tracker-cannibal-evidence.cjs src/index.js
          node scripts/patch-tracker-cannibal-evidence.cjs src/index.js
          node scripts/patch-tracker-growth-completion.cjs src/index.js
          node scripts/patch-tracker-growth-completion.cjs src/index.js
          git diff --check
      - name: Verify canonical entry and evidence regression tests
        run: |
          node --check src/index.js
          node --check src/brief-quality.js
          node src/brief-quality.test.js
          node tests/tracker-cannib-evidence.test.cjs
          node --check src/tracker-growth-plan.cjs
          node tests/tracker-growth-plan.test.cjs
          node tests/tracker-growth-integration.test.cjs
      - name: Persist the exactly tested canonical scanner on review branch only
        if: success() && github.event_name == 'push'
        run: |
          test "$GITHUB_REF_NAME" = "tracker-evidence-growth-20261011"
          git add src/index.js
          if ! git diff --cached --quiet; then
            git config user.name contentscale-review-ci
            git config user.email contentscale-review-ci@users.noreply.github.com
            git commit -m "review: verified cannibalization evidence guard [skip ci]"
            git push origin HEAD:refs/heads/tracker-evidence-growth-20261011
          fi
