name: Tracker evidence review (NO DEPLOY)
on:
  push:
    branches: [tracker-evidence-growth-20261011]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/brief-quality.js && node src/brief-quality.test.js
      - run: TRACKER_FOCUSED_SOURCE=1 node scripts/inspect-tracker-growth-contract.cjs
