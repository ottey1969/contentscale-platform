name: Verify Growth CMS obsolete warning and ZIP flow
on:
  push:
    branches: [fix/growth-cms-remove-stale-claims-20261117]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check public/growth-cms-neutral-handoff.js
          node --check src/tracker-growth-cms-export.cjs
      - name: CMS warning, optional concepts and package regression
        run: |
          node --test tests/growth-cms-obsolete-warning.test.cjs
          node --test tests/growth-cms-handoff-zero-statements.test.cjs
          node --test tests/growth-sentence-removals.test.cjs
          node --test tests/growth-proposal-cms-handoff.test.cjs
          node --test src/growth-cms-handoff.test.cjs
