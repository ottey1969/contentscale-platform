name: Apply ended Case Study UI on feature branch
on:
  push:
    branches: ['fix/case-study-end-scan-consent-20261116']
    paths: ['scripts/patch-case-study-ended-view-20261116.cjs']
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check scripts/patch-case-study-ended-view-20261116.cjs
          node scripts/patch-case-study-ended-view-20261116.cjs
          node --check src/index.js
          node --test tests/golden-owner-cases.test.cjs tests/tracker-case-study-scan-consent.test.cjs
      - run: |
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          git commit -m "fix: ended Case Study supersedes historical waiting scan action"
          git push origin HEAD:fix/case-study-end-scan-consent-20261116
