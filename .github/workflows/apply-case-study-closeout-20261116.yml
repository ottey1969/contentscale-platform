name: Apply Case Study closeout patch on feature branch
on:
  push:
    branches: ['fix/case-study-end-scan-consent-20261116']
    paths: ['scripts/patch-case-study-closeout-20261116.cjs']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply audited source transformations
        run: |
          node --check scripts/patch-case-study-closeout-20261116.cjs
          node scripts/patch-case-study-closeout-20261116.cjs
          node --check src/index.js
          node --test tests/tracker-case-study-scan-consent.test.cjs tests/golden-owner-cases.test.cjs
      - name: Commit feature-branch result only
        run: |
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          git commit -m "fix: hard-stop ended Case Study and require new manual scan consent"
          git push origin HEAD:fix/case-study-end-scan-consent-20261116
