name: Tracker Readonly Hotfix (Branch Only)
on:
  push:
    branches:
      - hotfix/tracker-readonly-access-20261017
    paths:
      - scripts/fix-tracker-readonly-access.cjs
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/tracker-readonly-access-20261017
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact canonical read route patch
        run: node scripts/fix-tracker-readonly-access.cjs --write
      - name: Exercise share read access and preserve disabled/paused safeguards
        run: |
          node scripts/tracker-readonly-access.test.cjs
          node --check src/index.js
      - name: Save verified source to hotfix branch only
        run: |
          git config user.name "contentscale-hotfix-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          if ! git diff --cached --quiet; then
            git commit -m "Fix Tracker shared read-only link loading without GSC gate"
            git push origin HEAD:hotfix/tracker-readonly-access-20261017
          fi
