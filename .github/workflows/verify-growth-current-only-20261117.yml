name: Verify Growth current research only
on:
  push:
    branches: [fix/growth-current-research-only-clean-20261117]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check public/growth-cms-neutral-handoff.js
          node --check src/tracker-growth-cms-export.cjs
      - run: |
          node --test tests/growth-cms-no-legacy-concepts.test.cjs
          node --test tests/growth-cms-overview-no-auto-add.test.cjs
          node --test tests/growth-cms-query-intent.test.cjs
          node --test tests/growth-cms-obsolete-warning.test.cjs
          node --test tests/growth-proposal-cms-handoff.test.cjs
          node --test tests/growth-sentence-removals.test.cjs
