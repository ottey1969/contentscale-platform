name: Verify unbiased Growth AI prompt
on:
  push:
    branches: [fix/growth-ai-mention-citation-recommendation-prompt-20261117]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/growth-free/ai-answers.cjs
          node --check src/tracker-growth-automatic-routes.cjs
      - name: Verified prompt and parser regression tests
        run: |
          node --test tests/growth-verification-prompt.test.cjs
          node --test tests/growth-ai-check-validation.test.cjs
          node --test tests/growth-tracker-ai-check.test.cjs
          node --test tests/growth-prewrite-ai-evidence.test.cjs
