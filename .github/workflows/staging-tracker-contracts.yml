name: Staging Tracker read-only contracts
on:
  push:
    branches: [tracker-staging]
  pull_request:
    branches: [tracker-staging]
jobs:
  stage2-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tracker staging isolated unit tests
        run: node --test tests/staging-tracker-readonly.test.cjs tests/staging-tracker-synthetic-readiness.test.cjs tests/staging-tracker-get-readiness.test.cjs tests/staging-tracker-historical-integrity.test.cjs tests/staging-tracker-release-decision.test.cjs tests/staging-tracker-readonly-coverage.test.cjs
