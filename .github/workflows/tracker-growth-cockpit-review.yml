name: Growth Cockpit review (NO DEPLOY)
on:
  push:
    branches: [tracker-growth-cockpit-20261011]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Register cockpit on canonical Tracker app, idempotently
        run: |
          node scripts/patch-tracker-growth-cockpit.cjs src/index.js
          node scripts/patch-tracker-growth-cockpit.cjs src/index.js
          git diff --check
      - name: Validate actual growth routes and existing Tracker source
        run: |
          node --check src/index.js
          node --check src/tracker-growth-cockpit.cjs
          node tests/tracker-growth-cockpit.test.cjs
          node tests/tracker-growth-closeout-handler.test.cjs
      - name: Persist exact verified source on review branch
        if: success() && github.event_name == 'push'
        run: |
          test "$GITHUB_REF_NAME" = "tracker-growth-cockpit-20261011"
          git add src/index.js
          if ! git diff --cached --quiet; then
            git config user.name contentscale-review-ci
            git config user.email contentscale-review-ci@users.noreply.github.com
            git commit -m "review: tested Growth Cockpit registration [skip ci]"
            git push origin HEAD:refs/heads/tracker-growth-cockpit-20261011
          fi
