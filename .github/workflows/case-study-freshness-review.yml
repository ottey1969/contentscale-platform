name: Case Study freshness review (NO DEPLOY)
on:
  push:
    branches: [tracker-case-study-freshness-20261011]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/inspect-case-study-freshness.cjs
