name: Case Study freshness review (NO DEPLOY)
on:
  push:
    branches: [tracker-case-study-freshness-20261011]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply case study freshness transparency patch twice
        run: |
          node scripts/patch-case-study-freshness.cjs src/index.js
          node scripts/patch-case-study-freshness.cjs src/index.js
          git diff --check
      - name: Verify old Day-30 report and canonical application syntax
        run: |
          node --check src/index.js
          node tests/tracker-case-study-freshness.test.cjs
      - name: Persist tested source on review branch only
        if: success() && github.event_name == 'push'
        run: |
          test "$GITHUB_REF_NAME" = "tracker-case-study-freshness-20261011"
          git add src/index.js
          if ! git diff --cached --quiet; then
            git config user.name contentscale-review-ci
            git config user.email contentscale-review-ci@users.noreply.github.com
            git commit -m "review only: Case Study GSC freshness report [skip ci]"
            git push origin HEAD:refs/heads/tracker-case-study-freshness-20261011
          fi
