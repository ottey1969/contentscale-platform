name: Free Growth check (standalone)
on:
  pull_request:
    paths:
      - 'src/growth-free/**'
      - 'src/gsc-report/**'
      - 'tests/gsc-report-*.test.cjs'
      - 'src/index.js'
      - 'tests/growth-free-check.test.cjs'
      - 'tests/growth-free-e2e.test.cjs'
      - 'tests/growth-free-ai-answer-import.test.cjs'
      - 'tests/growth-free-insufficient-e2e.test.cjs'
      - 'tests/growth-free-owner-e2e.test.cjs'
      - 'tests/growth-ai-check-validation.test.cjs'
      - 'tests/growth-free-gsc-export.test.cjs'
      - 'tests/growth-free-cms-package.test.cjs'
      - 'tests/growth-customer-questions.test.cjs'
      - 'tests/growth-free-measurement.test.cjs'
      - 'tests/growth-free-contacts.test.cjs'
      - 'tests/growth-free-ui-translate.test.cjs'
      - 'src/rank-free/**'
      - 'tests/rank-free*.test.cjs'
      - 'src/growth-measurement-reminders.cjs'
      - 'tests/helpers/zip.cjs'
      - 'public/prewrite-ai-answer-research.js'
      - 'src/prewrite-ai-answer-research.cjs'
      - 'src/tracker-growth-automatic-routes.cjs'
      - 'src/growth-*.cjs'
      - 'package.json'
      - '.github/workflows/growth-free-check.yml'
  push:
    branches: [main]
    paths:
      - 'src/growth-free/**'
      - 'src/gsc-report/**'
      - 'tests/gsc-report-*.test.cjs'
      - 'src/index.js'
      - 'tests/growth-free-check.test.cjs'
      - 'tests/growth-free-e2e.test.cjs'
      - 'tests/growth-free-ai-answer-import.test.cjs'
      - 'tests/growth-free-insufficient-e2e.test.cjs'
      - 'tests/growth-free-owner-e2e.test.cjs'
      - 'tests/growth-ai-check-validation.test.cjs'
      - 'tests/growth-free-gsc-export.test.cjs'
      - 'tests/growth-free-cms-package.test.cjs'
      - 'tests/growth-customer-questions.test.cjs'
      - 'tests/growth-free-measurement.test.cjs'
      - 'tests/growth-free-contacts.test.cjs'
      - 'src/rank-free/**'
      - 'tests/rank-free*.test.cjs'
      - 'src/growth-measurement-reminders.cjs'
      - 'tests/helpers/zip.cjs'
      - 'public/prewrite-ai-answer-research.js'
      - 'src/prewrite-ai-answer-research.cjs'
      - 'src/tracker-growth-automatic-routes.cjs'
      - 'src/growth-*.cjs'
jobs:
  free-growth-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (no browser download)
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci --ignore-scripts
      - name: Access keys, limits, read-only engine, summary, public flow, admin, standalone server
        run: node --test tests/growth-free-best-own-page.test.cjs tests/free-growth-content-priorities.test.cjs tests/growth-page-chrome-not-content.test.cjs tests/free-growth-paid-card-voice.test.cjs tests/growth-topic-no-competitor-numbering.test.cjs tests/growth-ai-question-matches-term.test.cjs tests/growth-trim-keeps-own-offer.test.cjs tests/growth-ai-answer-other-question.test.cjs tests/tracker-growth-content-priorities.test.cjs tests/tracker-growth-brief-consistency.test.cjs tests/free-growth-competitor-labels.test.cjs tests/free-growth-no-gsc.test.cjs tests/growth-free-check.test.cjs tests/growth-free-simple-start.test.cjs tests/growth-free-ui-translate.test.cjs tests/growth-free-schema-help.test.cjs tests/growth-free-ai-gap.test.cjs tests/growth-ai-check-validation.test.cjs tests/growth-free-gsc-export.test.cjs tests/growth-free-cms-package.test.cjs tests/growth-customer-questions.test.cjs tests/growth-free-measurement.test.cjs tests/rank-free.test.cjs tests/rank-free-maps.test.cjs tests/rank-free-maps-clarity.test.cjs tests/rank-free-region.test.cjs tests/rank-free-maps-town-keyword.test.cjs tests/rank-free-confirm-link.test.cjs tests/rank-free-short-pages.test.cjs tests/rank-free-grid.test.cjs tests/gsc-report-analysis.test.cjs tests/gsc-report-routes.test.cjs tests/gsc-report-redirects.test.cjs tests/gsc-report-site-audit.test.cjs tests/gsc-report-suggest-terms.test.cjs tests/gsc-report-delete.test.cjs tests/gsc-report-derayah-case.test.cjs tests/gsc-report-firecrawl.test.cjs tests/gsc-report-audit-plus.test.cjs tests/gsc-report-article-schema.test.cjs tests/gsc-report-table-align.test.cjs tests/gsc-report-updated-date.test.cjs tests/gsc-report-before-after.test.cjs tests/growth-free-gsc-report-numbers.test.cjs tests/gsc-report-open-result.test.cjs tests/growth-free-publication-note.test.cjs tests/growth-free-search-location.test.cjs tests/growth-ai-gap-informational.test.cjs

  free-growth-browser-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: growth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d growth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PREWRITE_E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/growth_test
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project and browser test dependencies
        run: |
          npm ci --ignore-scripts
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: End-to-end Free Growth browser and isolated PostgreSQL test
        run: node --test --test-concurrency=1 tests/growth-free-e2e.test.cjs tests/growth-free-insufficient-e2e.test.cjs tests/growth-free-owner-e2e.test.cjs tests/growth-free-contacts.test.cjs tests/growth-free-ai-answer-import.test.cjs tests/growth-ai-answer-other-question.test.cjs tests/rank-free-growth-handoff.test.cjs tests/gsc-report-postgres.test.cjs tests/gsc-report-browser-e2e.test.cjs
