name: Free Growth check (standalone)
on:
  pull_request:
    paths:
      - 'src/growth-free/**'
      - 'tests/growth-free-check.test.cjs'
      - 'tests/growth-free-e2e.test.cjs'
      - 'tests/growth-free-insufficient-e2e.test.cjs'
      - 'tests/growth-free-owner-e2e.test.cjs'
      - 'tests/growth-ai-check-validation.test.cjs'
      - 'tests/growth-free-gsc-export.test.cjs'
      - 'tests/growth-free-cms-package.test.cjs'
      - 'tests/growth-customer-questions.test.cjs'
      - 'tests/growth-free-measurement.test.cjs'
      - 'tests/growth-free-contacts.test.cjs'
      - 'tests/growth-free-ui-translate.test.cjs'
      - 'src/rank-free/**'
      - 'tests/rank-free*.test.cjs'
      - 'src/growth-measurement-reminders.cjs'
      - 'tests/helpers/zip.cjs'
      - 'public/prewrite-ai-answer-research.js'
      - 'src/prewrite-ai-answer-research.cjs'
      - 'src/tracker-growth-automatic-routes.cjs'
      - 'src/growth-*.cjs'
      - 'package.json'
      - '.github/workflows/growth-free-check.yml'
  push:
    branches: [main]
    paths:
      - 'src/growth-free/**'
      - 'tests/growth-free-check.test.cjs'
      - 'tests/growth-free-e2e.test.cjs'
      - 'tests/growth-free-insufficient-e2e.test.cjs'
      - 'tests/growth-free-owner-e2e.test.cjs'
      - 'tests/growth-ai-check-validation.test.cjs'
      - 'tests/growth-free-gsc-export.test.cjs'
      - 'tests/growth-free-cms-package.test.cjs'
      - 'tests/growth-customer-questions.test.cjs'
      - 'tests/growth-free-measurement.test.cjs'
      - 'tests/growth-free-contacts.test.cjs'
      - 'src/rank-free/**'
      - 'tests/rank-free*.test.cjs'
      - 'src/growth-measurement-reminders.cjs'
      - 'tests/helpers/zip.cjs'
      - 'public/prewrite-ai-answer-research.js'
      - 'src/prewrite-ai-answer-research.cjs'
      - 'src/tracker-growth-automatic-routes.cjs'
      - 'src/growth-*.cjs'
jobs:
  free-growth-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (no browser download)
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci --ignore-scripts
      - name: Access keys, limits, read-only engine, summary, public flow, admin, standalone server
        run: node --test tests/growth-free-check.test.cjs tests/growth-free-ui-translate.test.cjs tests/growth-free-schema-help.test.cjs tests/growth-free-ai-gap.test.cjs tests/growth-ai-check-validation.test.cjs tests/growth-free-gsc-export.test.cjs tests/growth-free-cms-package.test.cjs tests/growth-customer-questions.test.cjs tests/growth-free-measurement.test.cjs tests/rank-free.test.cjs tests/rank-free-maps.test.cjs tests/rank-free-maps-clarity.test.cjs tests/rank-free-region.test.cjs tests/rank-free-maps-town-keyword.test.cjs tests/rank-free-confirm-link.test.cjs tests/rank-free-grid.test.cjs

  free-growth-browser-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: growth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d growth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PREWRITE_E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/growth_test
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project and browser test dependencies
        run: |
          npm ci --ignore-scripts
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: End-to-end Free Growth browser and isolated PostgreSQL test
        run: node --test --test-concurrency=1 tests/growth-free-e2e.test.cjs tests/growth-free-insufficient-e2e.test.cjs tests/growth-free-owner-e2e.test.cjs tests/growth-free-contacts.test.cjs tests/rank-free-growth-handoff.test.cjs
