name: One-time Tracker monitoring inline repair
on:
  push:
    branches: [growth/prt-baseline-tracker-resume-20261016]
    paths:
      - '.github/workflows/tracker-monitoring-inline-once.yml'
jobs:
  apply-exact-guard:
    if: github.repository == 'ottey1969/contentscale-platform'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: growth/prt-baseline-tracker-resume-20261016
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch only the existing inline Tracker classifier
        run: node scripts/fix-tracker-manual-monitoring-next-action.cjs --write
      - name: Prove syntax and regression with the actual UI state machine
        run: |
          node --check src/index.js
          node src/tracker-manual-monitoring-next-action.test.cjs
          node scripts/fix-tracker-manual-monitoring-next-action.cjs --verify
      - name: Commit only the surgical Tracker UI change
        run: |
          git diff --check
          if git diff --quiet -- src/index.js; then echo 'Already applied'; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          git commit -m "Fix completed monitoring showing stale Brief next action"
          git push origin HEAD:refs/heads/growth/prt-baseline-tracker-resume-20261016
