name: Finalize Tracker optional GSC copy (branch only)
on:
  push:
    branches:
      - hotfix/tracker-gsc-modal-20261017
    paths:
      - scripts/fix-tracker-optional-gsc-advice.cjs
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/tracker-gsc-modal-20261017
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply canonical final wording
        run: node scripts/fix-tracker-optional-gsc-advice.cjs --write
      - name: Verify onboarding never blocks
        run: |
          node scripts/tracker-optional-gsc-advice.test.cjs
          node --check src/index.js
      - name: Commit only confirmed change
        run: |
          git config user.name "contentscale-tracker-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          if ! git diff --cached --quiet; then
            git commit -m "Align optional GSC recommendation with correct Tracker step order"
            git push origin HEAD:hotfix/tracker-gsc-modal-20261017
          fi
